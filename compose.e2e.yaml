services:
  backend:
    build:
      args:
        INCLUDE_E2E_FIXTURES: "true"
    environment:
      SPRING_PROFILES_ACTIVE: keycloak,e2e
      PUBLIC_BOOKING_HMAC_ACTIVE_KEY_ID: e2e-v1
      PUBLIC_BOOKING_HMAC_KEYS: e2e-v1=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CLIENT_ACCESS_VERIFIER_ACTIVE_KEY_ID: e2e-verifier-v1
      CLIENT_ACCESS_PHONE_ENCRYPTION_ACTIVE_KEY_ID: e2e-phone-v1
      CLIENT_ACCESS_FINGERPRINT_KEY_ID: e2e-fingerprint-v1
      CLIENT_ACCESS_VERIFIER_KEY_RING: e2e-verifier-v1=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      CLIENT_ACCESS_FINGERPRINT_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      CLIENT_ACCESS_PHONE_ENCRYPTION_KEY_RING: e2e-phone-v1=AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      CLIENT_ACCESS_SESSION_TTL_SECONDS: "900"
      CLIENT_ACCESS_COOKIE_SECURE: "false"
      CLIENT_ACCESS_E2E_EMITTER_ENABLED: "true"
      CLIENT_ACCESS_E2E_EMITTER_SECRET: e2e-only-synthetic-emitter-secret-000000000000
      APP_BILLING_E2E_WEBHOOK_SECRET: ${APP_BILLING_E2E_WEBHOOK_SECRET:?Defina APP_BILLING_E2E_WEBHOOK_SECRET em .env.e2e}
