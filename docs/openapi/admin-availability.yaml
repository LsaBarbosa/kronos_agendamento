openapi: 3.1.0
info:
  title: App Agendamento — configuração administrativa de agenda
  version: 1.0.0
  description: >-
    Contrato administrativo protegido pela sessão OIDC do backend. Tenant e ator são derivados
    do vínculo autenticado no servidor; não há parâmetro tenantId nestas operações.
servers:
  - url: /api/v1
paths:
  /admin/no-show-policy:
    x-implementation-status: implemented-AGD-032-policy-configuration-only
    get:
      operationId: getAdminNoShowPolicy
      summary: Consultar configuração do limite de faltas do tenant autenticado
      security: [{ backendSession: [] }]
      responses:
        "200":
          description: >-
            Configuração explícita 1–5 ou ausência sem default. O status da
            integração por cliente é retornado como restrictionIntegrationStatus;
            consulte a API de fatos para restrictionStatus e restrição ativa.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Diretiva privada no-store (Spring acrescenta outras diretivas de cache).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientNoShowPolicy" }
        "401": { description: Sessão ausente/expirada }
        "403": { description: Associação administrativa não autorizada/revogada }
    put:
      operationId: replaceAdminNoShowPolicy
      summary: Configurar ou alterar limite de faltas com CAS
      security: [{ backendSession: [], csrfToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, threshold]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                threshold: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200":
          description: Política persistida; replay não repete auditoria.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Diretiva privada no-store (Spring acrescenta outras diretivas de cache).
            Idempotency-Replayed: { schema: { type: string, enum: ["true", "false"] } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientNoShowPolicy" }
        "400": { description: Corpo inválido ou threshold fora de 1–5 }
        "401": { description: Sessão ausente/expirada }
        "403": { description: Associação administrativa não autorizada/revogada }
        "409": { description: VERSION_CONFLICT ou IDEMPOTENCY_KEY_REUSED }
  /public/{slug}/availability:
    x-implementation-status: implemented-AGD-014
    x-public-access-enabled: true
    get:
      operationId: getPublicAvailability
      summary: Consultar ofertas indicativas por serviço e janela local
      description: >-
        Resolve o slug no servidor e revalida publicação, estado ACTIVE e prontidão em cada leitura.
        Tenant ACTIVE, serviço ativo e agenda configurada não bastam. A consulta não cria hold nem
        garante confirmação. Falha da fonte obrigatória de ocupações retorna 503, nunca agenda vazia.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: serviceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          description: Data local inclusiva no timezone IANA confiável do tenant.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Data local inclusiva; from deve ser <= to e a janela contém no máximo 31 datas.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Resultado indicativo ordenado; ausência de configuração não aplica defaults.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityRange" }
        "400":
          description: Janela invertida ou com mais de 31 datas; erro INVALID_AVAILABILITY_WINDOW.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Serviço inexistente, inativo, alheio ou não publicável, sem revelar tenant.
        "503":
          description: Fonte obrigatória de ocupações indisponível; não equivale a horários livres.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /public/{slug}:
    get:
      operationId: getPublicBusiness
      summary: Consultar o perfil publicável por slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Perfil mínimo de negócio publicado e ainda elegível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBusiness" }
        "404":
          description: Slug inexistente, despublicado, suspenso ou fora da prontidão.

  /public/{slug}/services:
    get:
      operationId: listPublicServices
      summary: Listar serviços ativos publicáveis
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Serviços ativos sem buffer ou dados administrativos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicService" }
        "404": { description: Negócio inexistente ou não publicável. }

  /public/{slug}/services/{serviceId}:
    get:
      operationId: getPublicService
      summary: Consultar serviço ativo do tenant resolvido pelo slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: serviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Serviço ativo, sem buffer, assinatura ou dados internos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicService" }
        "404":
          {
            description: Recurso inexistente,
            inativo,
            alheio ou não publicável.,
          }

  /public/{slug}/telemetry:
    post:
      operationId: recordPublicTelemetry
      summary: Registrar evento agregado sem identificadores ou PII
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event]
              properties:
                event:
                  type: string
                  enum: [SERVICE_SELECTED, SLOT_SELECTED, FLOW_ABANDONED]
      responses:
        "204":
          { description: Evento agregado em métrica de baixa cardinalidade. }
        "400": { description: Evento fora da lista permitida. }
        "404": { description: Negócio não publicável. }

  /public/{slug}/appointments:
    post:
      operationId: createPublicAppointment
      summary: Confirmar uma reserva no commit
      description: >-
        Resolve tenant e zona pelo slug. Revalida publicação, readiness, serviço ativo, políticas,
        slot, bloqueios e ocupações no servidor. Disponibilidade não é hold. Telefone E.164 não
        autentica o cliente nem habilita consulta de reservas. A resposta não contém PII. Mutação
        exige token CSRF retornado por GET /api/v1/csrf.
      security:
        - csrfToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicAppointmentRequest" }
      responses:
        "201":
          description: Reserva, cliente, história, audit, idempotência e outbox confirmados juntos; replay retorna as mesmas referências.
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PublicAppointmentConfirmation" }
        "400":
          description: Entrada inválida, telefone não E.164 ou offset inválido para o timezone do tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          {
            description: Negócio/serviço inexistente,
            inativo ou não publicável; resposta não reveladora.,
          }
        "409":
          description: SLOT_NO_LONGER_AVAILABLE, IDEMPOTENCY_KEY_REUSED ou OPERATION_IN_PROGRESS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { description: Política de reserva não atendida. }
        "503":
          {
            description: Fonte obrigatória de ocupações indisponível; a API não presume agenda vazia.,
          }

  /admin/publication:
    get:
      operationId: getAdminPublicationStatus
      summary: Consultar estado de publicação e bloqueios do tenant autenticado
      security:
        - backendSession: []
      responses:
        "200":
          description: Estado versionado e itens de prontidão ainda pendentes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPublication" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
    put:
      operationId: changeAdminPublicationStatus
      summary: Publicar ou despublicar explicitamente
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [published, expectedVersion]
              properties:
                published: { type: boolean }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Estado publicado/despublicado, ou replay autorizado.
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPublication" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "409": { description: Prontidão ou versionamento impedem a mudança. }

  /admin/public-profile:
    put:
      operationId: updateAdminPublicContact
      summary: Atualizar telefone de contato público do tenant autenticado
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contactPhone, expectedVersion]
              properties:
                contactPhone: { type: string, minLength: 6, maxLength: 32 }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Telefone alterado com CAS, idempotência e auditoria.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPublication" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }

  /admin/schedule/weekly-periods:
    get:
      operationId: getAdminWeeklySchedule
      summary: Consultar a grade semanal do tenant autenticado
      security:
        - backendSession: []
      responses:
        "200":
          description: Grade semanal; scheduleRevision é contador monotônico das alterações de agenda, independente das versões locais.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySchedule"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/ActionNotAllowed"
    put:
      operationId: replaceAdminWeeklySchedule
      summary: Substituir atomicamente todos os períodos semanais
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceWeeklySchedule"
      responses:
        "200":
          description: Configuração persistida ou replay do resultado original.
          headers:
            Idempotency-Replayed:
              schema: { type: boolean }
            X-Operation-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySchedule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/ActionNotAllowed"
        "409":
          $ref: "#/components/responses/CommandConflict"
  /admin/availability-policy:
    get:
      operationId: getAdminAvailabilityPolicy
      summary: Consultar as políticas do tenant autenticado
      security:
        - backendSession: []
      responses:
        "200":
          description: Política; valores null indicam que ainda não foi configurada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPolicy"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/ActionNotAllowed"
    put:
      operationId: replaceAdminAvailabilityPolicy
      summary: Substituir atomicamente todas as políticas de disponibilidade
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAvailabilityPolicy"
      responses:
        "200":
          description: Política persistida ou replay do resultado original.
          headers:
            Idempotency-Replayed:
              schema: { type: boolean }
            X-Operation-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPolicy"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/ActionNotAllowed"
        "409":
          $ref: "#/components/responses/CommandConflict"
  /admin/schedule/exceptions:
    get:
      operationId: listAdminScheduleExceptions
      summary: Consultar exceções por intervalo de datas locais
      security: [{ backendSession: [] }]
      parameters:
        - {
            name: from,
            in: query,
            required: true,
            description: Data local inicial inclusiva; intervalo total limitado a 366 datas.,
            schema: { type: string, format: date },
          }
        - {
            name: to,
            in: query,
            required: true,
            description: Data local final inclusiva; intervalo total limitado a 366 datas.,
            schema: { type: string, format: date },
          }
      responses:
        "200":
          {
            description: Ausência de item mantém a grade semanal.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/ScheduleExceptionList" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
    post:
      operationId: createAdminScheduleException
      summary: Criar exceção fechada ou com horários especiais
      security: [{ backendSession: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/CreateScheduleException" },
              },
          }
      responses:
        "200":
          {
            description: Criada ou replay idempotente.,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/ScheduleException" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }
  /admin/schedule/exceptions/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: updateAdminScheduleException
      summary: Atualizar exceção com CAS
      security: [{ backendSession: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/UpdateScheduleException" },
              },
          }
      responses:
        "200":
          {
            description: Atualizada ou replay.,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/ScheduleException" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: Recurso inexistente ou inacessível. }
        "409": { $ref: "#/components/responses/CommandConflict" }
    delete:
      operationId: removeAdminScheduleException
      summary: Remover exceção e restaurar a grade semanal
      security: [{ backendSession: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [expectedVersion],
                    properties:
                      { expectedVersion: { type: integer, minimum: 1 } },
                  },
              },
          }
      responses:
        "200": { description: Removida ou replay idempotente. }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }
  /admin/blocked-periods:
    get:
      operationId: listAdminBlockedPeriods
      summary: Consultar bloqueios que intersectam datas locais
      security: [{ backendSession: [] }]
      parameters:
        - name: from
          in: query
          required: true
          description: Primeiro dia local inclusivo na zona do tenant; intervalo máximo de 366 dias.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Último dia local inclusivo na zona do tenant.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Bloqueios ativos ou cancelados no intervalo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedPeriod" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
    post:
      operationId: createAdminBlockedPeriod
      summary: Criar bloqueio com motivo obrigatório
      security: [{ backendSession: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CreateBlockedPeriod" } },
          }
      responses:
        "200":
          {
            description: Criado ou replay.,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/BlockedPeriod" } },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "409": { $ref: "#/components/responses/CommandConflict" }
  /admin/blocked-periods/{id}:
    delete:
      operationId: cancelAdminBlockedPeriod
      summary: Cancelar logicamente bloqueio com motivo e CAS
      security: [{ backendSession: [], csrfToken: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [expectedVersion, reason],
                    properties:
                      {
                        expectedVersion: { type: integer, minimum: 1 },
                        reason: { type: string, minLength: 1, maxLength: 500 },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Cancelado ou replay.,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/BlockedPeriod" } },
              },
          }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: Recurso inexistente ou inacessível. }
        "409": { $ref: "#/components/responses/CommandConflict" }
  /admin/appointments:
    get:
      operationId: listAdminAppointments
      summary: Consultar agenda por intervalo local, status e serviço
      description: >-
        Datas inclusivas no timezone atual do tenant, até 366 datas. Filtra pela interseção
        semiaberta da ocupação [startsAt, occupiedUntil) com a janela. O cursor keyset ordena por
        startsAt e appointmentId; cada página é uma leitura independente, portanto novos itens
        podem aparecer após atualizar. A consulta não altera estado.
      security: [{ backendSession: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [CONFIRMED, COMPLETED, NO_SHOW, CANCELLED_BY_CLIENT, CANCELLED_BY_PROVIDER] }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          description: Cursor opaco de continuação; não seleciona tenant nem concede acesso.
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Página ordenada, incluindo timezone IANA do tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "503": { description: Fonte da agenda temporariamente indisponível. }
    post:
      operationId: createAdminAppointment
      summary: Criar reserva administrativa ou encaixe
      description: >-
        Deriva tenant/ator da sessão atual. A lista ignorável contém somente OUTSIDE_WEEKLY_SCHEDULE
        e MIN_NOTICE; ambas exigem reason. OUTSIDE_WEEKLY_SCHEDULE ignora somente a grade semanal
        e só se aplica sem exceção por data. CLOSED continua fechado; SPECIAL substitui a grade,
        e a ocupação completa com buffer deve caber em um período especial. MIN_NOTICE é independente
        e pode ser ignorada dentro de SPECIAL se a ocupação respeitar seus períodos. Horizonte,
        serviço inativo, falta de configuração, bloqueios, ocupações e OVERLAP nunca são ignoráveis. O servidor
        revalida revisão da agenda e serviço no commit, compartilha lock PostgreSQL com reserva
        pública/bloqueio e mantém reserva, história, auditoria, idempotência e AppointmentConfirmed
        atômicos. Publicação pública não é pré-requisito. Motivo é preservado somente na história
        administrativa; não é copiado à auditoria nem outbox. Restrições de falta ainda não têm
        fonte persistida (AGD-032/033).
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminAppointment" }
      responses:
        "201":
          description: Reserva confirmada ou replay da criação original; resposta não contém telefone.
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: Cliente inexistente ou de outro tenant, sem revelar a diferença. }
        "409":
          description: Version conflict, regra não ignorável, OVERLAP, chave incompatível ou operação em andamento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503": { description: Leitura de agenda/ocupação indisponível; não assume agenda vazia. }
  /admin/clients:
    get:
      operationId: searchAdminClients
      summary: Busca limitada de clientes ativos para seleção administrativa
      description: Tenant-scoped; exige ao menos dois caracteres; retorna no máximo 20 nomes e IDs, nunca telefone.
      security: [{ backendSession: [] }]
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
      responses:
        "200": { description: Resultados limitados; a lista vazia não concede acesso a outros tenants. }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /admin/appointments/{id}:
    get:
      operationId: getAdminAppointment
      summary: Consultar detalhes históricos de uma reserva
      security: [{ backendSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Snapshot do atendimento autorizado no tenant atual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointment" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: ID inexistente ou pertencente a outro tenant; mesma resposta. }
  /admin/appointments/{id}/history:
    get:
      operationId: getAdminAppointmentHistory
      summary: Consultar eventos reais da história da reserva
      security: [{ backendSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: História do domínio, sem expor a tabela interna de auditoria.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentHistory" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: ID inexistente ou pertencente a outro tenant; mesma resposta. }
  /admin/appointments/{id}/reschedule:
    post:
      operationId: rescheduleAdminAppointment
      summary: Remarcar atomicamente uma reserva confirmada
      description: >-
        Deriva tenant e ator da associação administrativa atual. Exige expectedVersion da reserva
        e expectedScheduleRevision da agenda (controles independentes), Idempotency-Key e CSRF.
        Em uma nova mutação exige o serviço associado atualmente ACTIVE no tenant, verificando sua
        elegibilidade separadamente do snapshot e sincronizando com alterações concorrentes do catálogo.
        O destino e a ocupação continuam usando duração/buffer e snapshots originais da reserva;
        serviço inativo não é ignorável por override. Replay autorizado de comando concluído retorna
        o receipt original mesmo se o serviço tiver sido inativado posteriormente. Revalida destino,
        timezone/offset, grade, exceção, políticas,
        bloqueios e ocupações no protocolo READ COMMITTED com lock por tenant. O próprio appointment
        é excluído da consulta de ocupação; a exclusion constraint permanece como proteção final.
        Apenas OUTSIDE_WEEKLY_SCHEDULE e MIN_NOTICE podem ser solicitadas, sempre com confirmação
        representada no payload e motivo; CLOSED, SPECIAL, horizonte, bloqueios, overlap, serviço
        inativo e configuração ausente não são ignorados. Não herda overrides anteriores.
        Mutação, história antes/depois, auditoria, receipt idempotente e AppointmentRescheduled
        compartilham uma transação. Não significa que lembrete foi cancelado ou WhatsApp enviado.
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RescheduleAdminAppointment" }
      responses:
        "200":
          description: Novo horário da mesma reserva ou receipt do comando original em replay.
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentRescheduled" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: Reserva inexistente ou de outro tenant; mesma resposta. }
        "409":
          description: Versão de reserva/agenda desatualizada, regra não ignorável, conflito, digest divergente ou operação em andamento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503": { description: Fonte de agenda indisponível; nenhuma alteração é confirmada. }
  /admin/appointments/{id}/cancel:
    post:
      operationId: cancelAdminAppointment
      summary: Cancelar uma reserva pelo administrador
      description: >-
        Somente CONFIRMED. Deriva ator e tenant da sessão OIDC e associação atual; não representa
        cancelamento autenticado pelo cliente. Exige CAS, Idempotency-Key e CSRF. Reserva, estado,
        versão, história, auditoria, receipt e AppointmentCancelled compartilham o commit. Replays
        autorizados devolvem o receipt original mesmo após estado terminal. Liberação de ocupação
        ocorre somente após commit. Não exige que o serviço ainda esteja ativo. Cancelamento
        administrativo não usa nem herda o limite temporal de cancelamento do cliente.
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAppointmentOutcomeCommand" }
      responses:
        "200":
          description: Estado confirmado ou receipt original em replay.
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentOutcome" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: Reserva inexistente ou de outro tenant; mesma resposta. }
        "409": { description: Versão conflitante, transição inválida, chave reutilizada ou operação em andamento. }
  /admin/appointments/{id}/complete:
    post:
      operationId: completeAdminAppointment
      summary: Concluir atendimento
      description: >-
        Somente CONFIRMED. Por decisão de produto aprovada em 17/10/2026 (ADR-0018), exige
        Clock.instant() igual ou posterior a occupiedUntil, incluindo o buffer. Um atendimento
        09:00–09:30 ocupado até 09:45 só pode ser concluído a partir de 09:45. Não há tolerância
        adicional de dez minutos. Efeitos e replay são atômicos e autorizados como no cancelamento.
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAppointmentOutcomeCommand" }
      responses:
        "200":
          description: Resultado confirmado ou receipt original em replay.
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentOutcome" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: Reserva inexistente ou de outro tenant; mesma resposta. }
        "409": { description: Versão conflitante, limite temporal, transição inválida, chave reutilizada ou operação em andamento. }
  /admin/appointments/{id}/mark-no-show:
    post:
      operationId: markAdminAppointmentNoShow
      summary: Registrar falta do cliente
      description: >-
        Somente CONFIRMED. Por decisão de produto aprovada em 17/10/2026 (ADR-0018), exige
        Clock.instant() igual ou posterior a occupiedUntil, incluindo buffer; igualdade é permitida.
        Não há tolerância adicional de dez minutos. O evento é gravado uma única vez, mas não
        implementa contagem móvel ou bloqueio automático, que dependem de AGD-032/033.
      security:
        - backendSession: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAppointmentOutcomeCommand" }
      responses:
        "200":
          description: Resultado confirmado ou receipt original em replay.
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAppointmentOutcome" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/ActionNotAllowed" }
        "404": { description: Reserva inexistente ou de outro tenant; mesma resposta. }
        "409": { description: Versão conflitante, limite temporal, transição inválida, chave reutilizada ou operação em andamento. }
components:
  securitySchemes:
    backendSession:
      type: apiKey
      in: cookie
      name: AGDSESSION
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    ClientNoShowPolicy:
      type: object
      additionalProperties: false
      required: [configured, version, restrictionIntegrationStatus]
      properties:
        configured: { type: boolean }
        version: { type: integer, minimum: 0 }
        threshold: { type: [integer, "null"], minimum: 1, maximum: 5 }
        restrictionIntegrationStatus: { type: string, const: TRACKED }
    AdminAppointmentPage:
      type: object
      additionalProperties: false
      required: [timeZone, items, nextCursor, hasMore]
      properties:
        timeZone: { type: string, description: Timezone IANA atual do tenant. }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAppointment" }
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }
    AdminAppointment:
      type: object
      additionalProperties: false
      required:
        [appointmentId, serviceId, clientName, serviceName, startsAt, serviceEndsAt, occupiedUntil, timeZone, durationMinutes, bufferAfterMinutes, status, createdAt, version]
      properties:
        appointmentId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        clientName: { type: string, description: Snapshot necessário ao administrador autorizado. }
        serviceName: { type: string, description: Snapshot imutável do serviço. }
        startsAt: { type: string, format: date-time }
        serviceEndsAt: { type: string, format: date-time }
        occupiedUntil: { type: string, format: date-time, description: Fim da ocupação incluindo buffer. }
        timeZone: { type: string, description: Fuso IANA usado na confirmação. }
        durationMinutes: { type: integer }
        bufferAfterMinutes: { type: integer, minimum: 0 }
        status: { type: string, enum: [CONFIRMED, COMPLETED, NO_SHOW, CANCELLED_BY_CLIENT, CANCELLED_BY_PROVIDER] }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CreateAdminAppointment:
      type: object
      additionalProperties: false
      required: [serviceId, startsAt, overridePolicies, expectedScheduleVersion]
      properties:
        serviceId: { type: string, format: uuid }
        startsAt:
          type: string
          format: date-time
          description: Offset explícito validado contra o timezone IANA atual do tenant.
        clientId: { type: string, format: uuid, description: Cliente existente no tenant atual. }
        client:
          type: object
          additionalProperties: false
          required: [name, phone]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            phone: { type: string, maxLength: 80, description: Entrada normalizada/validada E.164 no servidor. }
        overridePolicies:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum: [OUTSIDE_WEEKLY_SCHEDULE, MIN_NOTICE]
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Obrigatório quando overridePolicies não estiver vazio; não é copiado à auditoria/outbox.
        expectedScheduleVersion:
          type: integer
          minimum: 1
          description: scheduleRevision lido junto da configuração administrativa.
      oneOf:
        - required: [clientId]
          not: { required: [client] }
        - required: [client]
          not: { required: [clientId] }
    AdminAppointmentCreated:
      type: object
      additionalProperties: false
      required: [appointmentId, operationId, status, serviceName, startsAt, serviceEndsAt, occupiedUntil, timeZone]
      properties:
        appointmentId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [CONFIRMED] }
        serviceName: { type: string }
        startsAt: { type: string, format: date-time }
        serviceEndsAt: { type: string, format: date-time }
        occupiedUntil: { type: string, format: date-time }
        timeZone: { type: string }
    RescheduleAdminAppointment:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedScheduleRevision, startsAt]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        expectedScheduleRevision: { type: integer, minimum: 0 }
        startsAt:
          type: string
          format: date-time
          description: Instante com offset válido na zona IANA atual do tenant.
        overridePolicies:
          type: array
          uniqueItems: true
          maxItems: 2
          items: { type: string, enum: [OUTSIDE_WEEKLY_SCHEDULE, MIN_NOTICE] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminAppointmentRescheduled:
      type: object
      additionalProperties: false
      required: [appointmentId, operationId, version, startsAt, serviceEndsAt, occupiedUntil, timeZone]
      properties:
        appointmentId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        version: { type: integer, minimum: 2 }
        startsAt: { type: string, format: date-time }
        serviceEndsAt: { type: string, format: date-time }
        occupiedUntil: { type: string, format: date-time }
        timeZone: { type: string }
    AdminAppointmentOutcomeCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500, description: Motivo administrativo opcional, visível apenas na história autorizada. }
    AdminAppointmentOutcome:
      type: object
      additionalProperties: false
      required: [appointmentId, operationId, status, version]
      properties:
        appointmentId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [CANCELLED_BY_PROVIDER, COMPLETED, NO_SHOW] }
        version: { type: integer, minimum: 2 }
    AdminAppointmentHistory:
      type: object
      additionalProperties: false
      required: [timeZone, items]
      properties:
        timeZone: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [toStatus, actorType, actorRef, reasonCode, reason, occurredAt]
            properties:
              fromStatus: { type: [string, "null"] }
              toStatus: { type: string }
              actorType: { type: string }
              actorRef: { type: string }
              reasonCode: { type: string }
              reason: { type: [string, "null"], description: Motivo fornecido no encaixe administrativo; somente visível no contexto autorizado. }
              occurredAt: { type: string, format: date-time }
    PublicBusiness:
      type: object
      additionalProperties: false
      required: [name, slug, timeZone, contactPhone]
      properties:
        name: { type: string }
        slug: { type: string }
        timeZone: { type: string, description: Tenant timezone IANA. }
        contactPhone: { type: [string, "null"] }
    PublicService:
      type: object
      additionalProperties: false
      required: [serviceId, name, description, durationMinutes]
      properties:
        serviceId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        durationMinutes: { type: integer, minimum: 1 }
    PublicAppointmentRequest:
      type: object
      additionalProperties: false
      required: [serviceId, startsAt, client]
      properties:
        serviceId: { type: string, format: uuid }
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 com offset explícito; deve corresponder a um slot atual no timezone do tenant.
        client:
          type: object
          additionalProperties: false
          required: [name, phone]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            phone:
              type: string
              pattern: '^\\+[1-9][0-9]{7,14}$'
              description: E.164 com código internacional explícito; não confere identidade.
    PublicAppointmentConfirmation:
      type: object
      additionalProperties: false
      required:
        [
          appointmentId,
          operationId,
          status,
          serviceName,
          startsAt,
          serviceEndsAt,
          timeZone,
        ]
      properties:
        appointmentId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        status: { type: string, const: CONFIRMED }
        serviceName: { type: string }
        startsAt: { type: string, format: date-time }
        serviceEndsAt: { type: string, format: date-time }
        timeZone: { type: string, description: Zona IANA do tenant. }
    AdminPublication:
      type: object
      additionalProperties: false
      required:
        [
          businessName,
          slug,
          timeZone,
          contactPhone,
          published,
          version,
          ready,
          blockers,
        ]
      properties:
        businessName: { type: string }
        slug: { type: string }
        timeZone: { type: string }
        contactPhone: { type: [string, "null"] }
        published: { type: boolean }
        version: { type: integer, minimum: 0 }
        ready: { type: boolean }
        blockers:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
    AvailabilitySlot:
      type: object
      additionalProperties: false
      required: [startsAt, serviceEndsAt]
      properties:
        startsAt:
          type: string
          format: date-time
          description: Instante com offset válido na zona IANA do tenant.
        serviceEndsAt:
          type: string
          format: date-time
          description: Fim do serviço; o buffer posterior já foi considerado na elegibilidade.
    AvailabilityDate:
      type: object
      additionalProperties: false
      required: [date, explicitlyClosed, slots]
      properties:
        date: { type: string, format: date }
        explicitlyClosed:
          type: boolean
          description: Diferencia fechamento explícito de configuração ausente ou fora do horizonte.
        slots:
          type: array
          items: { $ref: "#/components/schemas/AvailabilitySlot" }
    AvailabilityRange:
      type: object
      additionalProperties: false
      required: [serviceId, from, to, timeZone, generatedAt, configured, days]
      properties:
        serviceId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone:
          type: string
          description: Zona IANA confiável do tenant; timestamps dos slots incluem offset.
        generatedAt: { type: string, format: date-time }
        configured:
          type: boolean
          description: false quando grade semanal ou política não foi configurada; nenhum default é inferido.
        days:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityDate" }
    WeeklyPeriod:
      type: object
      additionalProperties: false
      required: [weekday, localStart, localEnd]
      properties:
        weekday:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        localStart:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):(?:00|15|30|45)$"
          description: Hora local do tenant em HH:mm, com minuto múltiplo de 15.
        localEnd:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):(?:00|15|30|45)$"
          description: Limite exclusivo no mesmo dia; deve ser posterior a localStart e alinhado a 15 minutos.
    WeeklySchedule:
      type: object
      additionalProperties: false
      required: [configured, timeZone, version, scheduleRevision, periods]
      properties:
        configured: { type: boolean }
        timeZone:
          type: string
          description: Zona IANA persistida do tenant.
        version:
          type: integer
          minimum: 0
        scheduleRevision:
          type: integer
          minimum: 0
          description: Contador monotônico agregado usado para detectar alteração concorrente; zero indica que ainda não houve alteração persistida, e não é soma das versões locais.
        periods:
          type: array
          items: { $ref: "#/components/schemas/WeeklyPeriod" }
    ReplaceWeeklySchedule:
      type: object
      additionalProperties: false
      required: [expectedVersion, periods]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        periods:
          type: array
          items: { $ref: "#/components/schemas/WeeklyPeriod" }
          description: Array vazio configura explicitamente todos os dias como fechados. Intervalos são [início,fim), adjacentes são permitidos, sobreposição e cruzamento de meia-noite são rejeitados.
    AvailabilityPolicy:
      type: object
      additionalProperties: false
      required:
        - configured
        - version
        - slotStepMinutes
        - minimumNoticeHours
        - bookingHorizonDays
        - cancellationCutoffHours
        - reminderOffsetHours
      properties:
        configured: { type: boolean }
        version: { type: integer, minimum: 0 }
        slotStepMinutes: { type: [integer, "null"], enum: [15, 30, 60, null] }
        minimumNoticeHours: { type: [integer, "null"], minimum: 1, maximum: 24 }
        bookingHorizonDays:
          { type: [integer, "null"], enum: [7, 30, 60, 90, null] }
        cancellationCutoffHours:
          { type: [integer, "null"], minimum: 2, maximum: 24 }
        reminderOffsetHours:
          type: [integer, "null"]
          enum: [2, 6, 12, 24, null]
          description: >-
            Ausência de política não cria lembrete. O offset é materializado
            quando o evento é consumido; alterações posteriores não recalculam
            intenções existentes. Um lembrete atrasado só é elegível enquanto
            a reserva estiver CONFIRMED, na versão atual e com início futuro.
    ReplaceAvailabilityPolicy:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - slotStepMinutes
        - minimumNoticeHours
        - bookingHorizonDays
        - cancellationCutoffHours
        - reminderOffsetHours
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        slotStepMinutes: { type: integer, enum: [15, 30, 60] }
        minimumNoticeHours: { type: integer, minimum: 1, maximum: 24 }
        bookingHorizonDays: { type: integer, enum: [7, 30, 60, 90] }
        cancellationCutoffHours: { type: integer, minimum: 2, maximum: 24 }
        reminderOffsetHours:
          type: integer
          enum: [2, 6, 12, 24]
          description: >-
            Offset explícito para materializar o lembrete quando o evento da
            reserva for consumido. Alterações posteriores não recalculam
            intenções já persistidas; ausência de política não cria lembrete.
    SpecialPeriod:
      type: object
      additionalProperties: false
      required: [localStart, localEnd]
      properties:
        localStart:
          { type: string, pattern: "^(?:[01][0-9]|2[0-3]):(?:00|15|30|45)$" }
        localEnd:
          {
            type: string,
            pattern: "^(?:[01][0-9]|2[0-3]):(?:00|15|30|45)$",
            description: Limite exclusivo no mesmo dia.,
          }
        localStartOffset:
          {
            type: [string, "null"],
            pattern: "^[+-](?:(?:0[0-9]|1[0-7]):[0-5][0-9]|18:00)$",
            description: Offset opcional para selecionar uma ocorrência ambígua válida na zona do tenant.,
          }
        localEndOffset:
          {
            type: [string, "null"],
            pattern: "^[+-](?:(?:0[0-9]|1[0-7]):[0-5][0-9]|18:00)$",
            description: Offset opcional para selecionar uma ocorrência ambígua válida na zona do tenant.,
          }
    ScheduleException:
      type: object
      required: [exceptionId, localDate, kind, periods, version, timeZone]
      properties:
        exceptionId: { type: string, format: uuid }
        localDate: { type: string, format: date }
        kind: { type: string, enum: [CLOSED, SPECIAL] }
        periods:
          { type: array, items: { $ref: "#/components/schemas/SpecialPeriod" } }
        reason: { type: [string, "null"], maxLength: 500 }
        version: { type: integer, minimum: 1 }
        timeZone: { type: string, description: Fuso IANA confiável do tenant. }
    ScheduleExceptionList:
      type: object
      additionalProperties: false
      required: [from, to, timeZone, exceptions]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone: { type: string, description: Fuso IANA confiável do tenant. }
        exceptions:
          {
            type: array,
            items: { $ref: "#/components/schemas/ScheduleException" },
          }
    CreateScheduleException:
      type: object
      additionalProperties: false
      required: [localDate, kind, periods]
      properties:
        localDate: { type: string, format: date }
        kind: { type: string, enum: [CLOSED, SPECIAL] }
        periods:
          { type: array, items: { $ref: "#/components/schemas/SpecialPeriod" } }
        reason: { type: [string, "null"], maxLength: 500 }
    UpdateScheduleException:
      allOf:
        - { $ref: "#/components/schemas/CreateScheduleException" }
        - type: object
          required: [expectedVersion]
          properties: { expectedVersion: { type: integer, minimum: 1 } }
    CreateBlockedPeriod:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt, reason]
      properties:
        startsAt:
          oneOf:
            - type: string
              pattern: '^\\d{4}-\\d{2}-\\d{2}T(?:[01]\\d|2[0-3]):(?:00|15|30|45)(?::00)?$'
              description: Data/hora local do tenant sem offset; limites em múltiplos de 15 minutos.
            - type: string
              format: date-time
              description: Data/hora com offset explícito, que deve corresponder à zona IANA do tenant.
        endsAt:
          oneOf:
            - type: string
              pattern: '^\\d{4}-\\d{2}-\\d{2}T(?:[01]\\d|2[0-3]):(?:00|15|30|45)(?::00)?$'
              description: Data/hora local do tenant sem offset; limites em múltiplos de 15 minutos.
            - type: string
              format: date-time
              description: Data/hora com offset explícito, que deve corresponder à zona IANA do tenant.
        reason: { type: string, minLength: 1, maxLength: 500 }
    BlockedPeriod:
      type: object
      required:
        [
          blockId,
          startsAt,
          endsAt,
          localStartsAt,
          localEndsAt,
          timeZone,
          reason,
          status,
          version,
        ]
      properties:
        blockId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        localStartsAt:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}T(?:[01]\\d|2[0-3]):[0-5]\\d:00$'
          description: Data/hora local sem offset, calculada na zona persistida do tenant.
        localEndsAt:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}T(?:[01]\\d|2[0-3]):[0-5]\\d:00$'
          description: Limite exclusivo local sem offset, calculado na zona persistida do tenant.
        timeZone: { type: string }
        reason: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        version: { type: integer, minimum: 1 }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: [string, "null"], maxLength: 500 }
    ApiError:
      type: object
      properties:
        error:
          type: object
          required: [code, message, traceId, retryable, details]
          properties:
            code: { type: string }
            message: { type: string }
            traceId: { type: string }
            retryable: { type: boolean }
            details: { type: object }
  responses:
    AuthenticationRequired:
      description: Sessão local ausente ou expirada.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ActionNotAllowed:
      description: Vínculo administrativo não ativo ou CSRF inválido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Entrada inválida; inclui INVALID_LOCAL_TIME para horário DST ou offset incompatível com a zona IANA do tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    CommandConflict:
      description: Versão concorrente, chave idempotente reutilizada ou operação em andamento.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
