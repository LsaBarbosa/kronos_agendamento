openapi: 3.1.0
info:
  title: App Agendamento — faltas e restrições de autoagendamento
  version: 1.0.0
  description: >-
    Consulta tenant-scoped explicável e correção compensatória específica.
    Política e restrição são estados separados. Política ausente é
    NOT_CONFIGURED e não implica CLEAR nem criação automática de restrição.
    Restrição ativa pode ser desbloqueada explicitamente pelo administrador.
    Redução de política não reconcilia clientes implicitamente; o administrador
    pode reconciliar um cliente por vez, informando a versão esperada.
servers:
  - url: /
paths:
  /api/v1/admin/clients/{id}/no-shows:
    get:
      operationId: getClientNoShowFacts
      summary: Consultar fatos de falta e contagem em 12 meses
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Count/facts coerentes no mesmo snapshot de leitura
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoShowFactsPage' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/appointments/{id}/correct-no-show:
    post:
      operationId: correctAdministrativeNoShow
      summary: Corrigir uma falta para concluída
      description: >-
        Somente NO_SHOW→COMPLETED. Exige motivo e versão; preserva o fato
        original e grava correção referenciada, auditoria, receipt e outbox
        na mesma transação. Replay exige autorização atual.
      security: [{ adminSession: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reason]
              additionalProperties: false
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Reserva agora COMPLETED; replay retorna receipt original
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                type: object
                required: [appointmentId, operationId, status, version]
                properties:
                  appointmentId: { type: string, format: uuid }
                  operationId: { type: string, format: uuid }
                  status: { type: string, const: COMPLETED }
                  version: { type: integer, minimum: 2 }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clients/{id}/restrictions/{restrictionId}/lift:
    post:
      operationId: liftClientBookingRestriction
      summary: Desbloquear explicitamente o autoagendamento do cliente
      description: >-
        Exige associação administrativa atual, motivo, expectedVersion e
        Idempotency-Key. Não apaga faltas. Status, histórico, auditoria,
        receipt e evento compartilham a transação. Replays devolvem o receipt
        original após revalidar autorização.
      security: [{ adminSession: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: restrictionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reason]
              additionalProperties: false
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Restrição marcada LIFTED; replay preserva o receipt original
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                type: object
                required: [restrictionId, status, version]
                properties:
                  restrictionId: { type: string, format: uuid }
                  status: { type: string, const: LIFTED }
                  version: { type: integer, minimum: 2 }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clients/{id}/restrictions/reconcile:
    post:
      operationId: reconcileClientBookingRestriction
      summary: Reavaliar explicitamente a política para um cliente
      description: >-
        Usa a política configurada e sua versão esperada depois do lock
        tenant-scoped. Não desbloqueia restrição, não reutiliza falta causal
        já consumida e não executa varredura global. Replay revalida autorização
        e devolve a decisão original.
      security: [{ adminSession: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedPolicyVersion]
              additionalProperties: false
              properties:
                expectedPolicyVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Decisão explicável persistida; receipt original em replay
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Idempotency-Replayed: { schema: { type: boolean } }
            X-Operation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                type: object
                required: [clientId, decision, asOf, windowStart, count, threshold, policyVersion, restrictionId, restrictionVersion]
                properties:
                  clientId: { type: string, format: uuid }
                  decision: { type: string, enum: [ACTIVATED, ALREADY_RESTRICTED, BELOW_THRESHOLD, NO_UNUSED_CAUSAL_FACT] }
                  asOf: { type: string, format: date-time }
                  windowStart: { type: string, format: date-time }
                  count: { type: integer, minimum: 0 }
                  threshold: { type: integer, minimum: 1, maximum: 5 }
                  policyVersion: { type: integer, minimum: 1 }
                  restrictionId: { type: string, format: uuid, nullable: true }
                  restrictionVersion: { type: integer, minimum: 1, nullable: true }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    adminSession: { type: apiKey, in: cookie, name: AGDSESSION }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-TOKEN }
  schemas:
    NoShowFactsPage:
      type: object
      required: [clientId, windowStart, asOf, timeZone, count, totalFacts, policyStatus, policyVersion, restrictionStatus, activeRestriction, restrictionHistory, facts, hasMore]
      properties:
        clientId: { type: string, format: uuid }
        windowStart: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
        timeZone: { type: string }
        count: { type: integer, minimum: 0 }
        totalFacts: { type: integer, minimum: 0 }
        policyStatus: { type: string, enum: [CONFIGURED, NOT_CONFIGURED] }
        threshold: { type: integer, minimum: 1, maximum: 5, nullable: true }
        policyVersion: { type: integer, minimum: 0 }
        restrictionStatus: { type: string, enum: [NOT_CONFIGURED, CLEAR, RESTRICTED] }
        activeRestriction:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [restrictionId, status, evaluatedAt, countAtActivation, thresholdAtActivation, policyVersion, version]
              properties:
                restrictionId: { type: string, format: uuid }
                status: { type: string, const: RESTRICTED }
                evaluatedAt: { type: string, format: date-time }
                countAtActivation: { type: integer, minimum: 1 }
                thresholdAtActivation: { type: integer, minimum: 1, maximum: 5 }
                policyVersion: { type: integer, minimum: 1 }
                version: { type: integer, minimum: 1 }
        restrictionHistory:
          type: array
          items:
            type: object
            required: [historyId, restrictionId, eventType, actorType, occurredAt, countAtDecision, thresholdAtDecision, policyVersion, restrictionVersion]
            properties:
              historyId: { type: string, format: uuid }
              restrictionId: { type: string, format: uuid }
              eventType: { type: string, enum: [ACTIVATED, RECONCILED, LIFTED] }
              actorType: { type: string, enum: [SYSTEM, ADMIN] }
              occurredAt: { type: string, format: date-time }
              countAtDecision: { type: integer, minimum: 0 }
              thresholdAtDecision: { type: integer, minimum: 1, maximum: 5 }
              policyVersion: { type: integer, minimum: 1 }
              restrictionVersion: { type: integer, minimum: 1 }
              reason: { type: string, nullable: true }
        facts:
          type: array
          items:
            type: object
            required: [historyId, appointmentId, recordedAt, currentStatus, appointmentVersion, contributes]
            properties:
              historyId: { type: string, format: uuid }
              appointmentId: { type: string, format: uuid }
              recordedAt: { type: string, format: date-time }
              currentStatus: { type: string, enum: [NO_SHOW, COMPLETED] }
              appointmentVersion: { type: integer, minimum: 1 }
              contributes: { type: boolean }
              correctionHistoryId: { type: string, format: uuid, nullable: true }
              correctedAt: { type: string, format: date-time, nullable: true }
              correctionReason: { type: string, nullable: true }
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
  responses:
    InvalidQuery: { description: Cursor/limite inválido }
    InvalidCommand: { description: Request inválido }
    Unauthorized: { description: Sessão inválida ou expirada }
    Forbidden: { description: Associação ou autorização inválida }
    NotFound: { description: Recurso não encontrado }
    Conflict: { description: Estado, versão ou chave idempotente incompatível }
    Unavailable: { description: Consulta temporariamente indisponível }
