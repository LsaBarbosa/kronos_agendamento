openapi: 3.1.0
info:
  title: App Agendamento — assinatura administrativa (AGD-040–043)
  version: 1.0.0
  description: >-
    Leitura tenant-scoped de estado comercial e ofertas fornecidas pelo servidor.
    Checkout só começa com oferta e provider configurados. A seleção do plano e o
    retorno do navegador nunca confirmam pagamento. A produção permanece fail-closed
    sem integração financeira aprovada e configurada.
servers:
  - url: /
paths:
  /api/v1/admin/subscription:
    get:
      operationId: getAdminSubscriptionOverview
      summary: Consultar trial, assinatura e ofertas do tenant autenticado
      security:
        - adminSession: []
      responses:
        "200":
          description: Estado atual ou ausência de assinatura e ofertas sem preços inventados
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    tenantContextId,
                    subscription,
                    plans,
                    checkoutOffers,
                    checkoutAvailable,
                    trialEligibilityPending,
                    commercialEligibility,
                    dunningAttempts,
                    annualRenewalNotices,
                    annualRenewalAuthorized,
                  ]
                properties:
                  tenantContextId:
                    {
                      type: string,
                      format: uuid,
                      description: Contexto retornado pelo servidor; é apenas precondição e nunca autoridade.,
                    }
                  subscription:
                    oneOf:
                      - $ref: "#/components/schemas/Subscription"
                      - type: "null"
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }
                  checkoutOffers:
                    type: array
                    items: { $ref: "#/components/schemas/CheckoutOffer" }
                  checkoutAvailable: { type: boolean }
                  trialEligibilityPending: { type: boolean }
                  commercialEligibility:
                    type: string
                    enum: [VERIFICATION_UNAVAILABLE, VERIFIED]
                  dunningAttempts:
                    type: array
                    description: >-
                      Estados minimizados do processamento. Agendamento, claim e aceite do
                      transporte não confirmam pagamento; resultado incerto bloqueia nova
                      cobrança lógica até reconciliação.
                    items: { $ref: "#/components/schemas/DunningAttempt" }
                  annualRenewalNotices:
                    type: array
                    description: >-
                      Intenções deduplicadas de aviso anual; READY significa apenas vencimento
                      técnico alcançado, sem evidência de envio ou entrega.
                    items: { $ref: "#/components/schemas/AnnualRenewalNotice" }
                  annualRenewalAuthorized:
                    type: boolean
                    description: >-
                      Consulta local à autorização explícita do período vigente. Falso inclui
                      ausência de fonte confiável e não inicia cobrança.
        "401": { description: Sessão ausente/expirada }
        "403": { description: Associação administrativa inválida ou revogada }
  /api/v1/admin/subscription/checkout:
    post:
      operationId: startAdminSubscriptionCheckout
      summary: Criar ou recuperar a intenção de checkout hospedado
      description: >-
        O servidor resolve preço, moeda, versão de oferta e termos. O corpo não
        aceita valores financeiros nem dados de cartão. A mesma chave/body recupera
        a operação; resultado incerto não autoriza uma nova cobrança lógica. O
        cabeçalho X-Expected-Tenant-Context vincula a intenção ao contexto observado;
        o servidor compara-o com a sessão autenticada antes de executar. Ele não
        concede nem seleciona tenant.
      security:
        - adminSession: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: header
          name: X-Expected-Tenant-Context
          required: true
          description: UUID devolvido pelo endpoint autenticado; precondição contra troca de contexto, não autoridade.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [planCode, expectedVersion]
              properties:
                planCode: { type: string, enum: [MONTHLY, ANNUAL] }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Estado da operação; CHECKOUT_READY não significa pagamento confirmado
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOperation" }
        "401": { description: Sessão ausente/expirada }
        "403": { description: Associação inválida ou revogada }
        "409":
          {
            description: Versão incompatível,
            checkout concorrente,
            chave divergente ou contexto de sessão alterado; códigos distinguem rejeições definitivas,
          }
        "408":
          {
            description: Resultado de transporte incerto; manter contexto,
            corpo e chave e recuperar a mesma operação,
          }
        "503":
          {
            description: Oferta,
            checkout hospedado ou integração não configurados,
          }
  /api/v1/admin/subscription/payment-attempts:
    get:
      operationId: listAdminCheckoutOperations
      summary: Listar operações de checkout minimizadas do tenant autenticado
      security:
        - adminSession: []
      parameters:
        - in: header
          name: X-Expected-Tenant-Context
          required: true
          description: Precondição comparada à sessão autenticada; não seleciona nem autoriza tenant.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Operações sem dados de cartão nem payload bruto do provedor
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CheckoutAttempt" }
        "401": { description: Sessão ausente/expirada }
        "403": { description: Associação inválida ou revogada }
  /api/v1/admin/subscription/payment-attempts/{operationId}:
    get:
      operationId: getAdminCheckoutOperation
      summary: Consultar e reconciliar a mesma operação de checkout
      security:
        - adminSession: []
      parameters:
        - in: header
          name: X-Expected-Tenant-Context
          required: true
          description: Precondição comparada à sessão autenticada; não seleciona nem autoriza tenant.
          schema: { type: string, format: uuid }
        - in: path
          name: operationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Estado atual minimizado; consulta não cria nova cobrança
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOperation" }
        "404":
          {
            description: Operação inexistente ou não pertencente ao tenant autenticado,
          }
        "401": { description: Sessão ausente/expirada }
        "403": { description: Associação inválida ou revogada }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: AGDSESSION
  schemas:
    Subscription:
      type: object
      required:
        [
          subscriptionId,
          status,
          trialStartedAt,
          trialEndsAt,
          planCode,
          paidThroughAt,
          graceEndsAt,
          version,
        ]
      properties:
        subscriptionId: { type: string, format: uuid }
        status: { type: string, enum: [TRIALING, PAST_DUE, SUSPENDED, ACTIVE] }
        trialStartedAt: { type: [string, "null"], format: date-time }
        trialEndsAt: { type: [string, "null"], format: date-time }
        planCode: { type: [string, "null"], enum: [MONTHLY, ANNUAL, null] }
        paidThroughAt: { type: [string, "null"], format: date-time }
        graceEndsAt:
          {
            type: [string, "null"],
            format: date-time,
            description: Fim persistido da tolerância; só é aplicável a PAST_DUE/assinatura suspensa por inadimplência.,
          }
        version: { type: integer, minimum: 1 }
    DunningAttempt:
      type: object
      additionalProperties: false
      required:
        [
          logicalSequence,
          scheduledAt,
          state,
          nextAttemptAt,
          technicalAttempts,
          safeErrorCode,
          skipReason,
        ]
      properties:
        logicalSequence: { type: integer, enum: [0, 3, 6] }
        scheduledAt: { type: string, format: date-time }
        nextAttemptAt: { type: [string, "null"], format: date-time }
        technicalAttempts: { type: integer, minimum: 0 }
        safeErrorCode: { type: [string, "null"], pattern: "^[A-Z0-9_]{1,48}$" }
        skipReason:
          { type: [string, "null"], enum: [LATE_RECOVERY_OLDER_DUE, null] }
        state:
          {
            type: string,
            enum:
              [
                SCHEDULED,
                BLOCKED_CONFIGURATION,
                CLAIMED,
                SUBMITTING,
                RETRYABLE_NO_EFFECT,
                OUTCOME_UNKNOWN,
                RECONCILING,
                ACCEPTED,
                DECLINED,
                FAILED_FINAL,
                SKIPPED_LATE_RECOVERY,
                CANCELLED,
              ],
          }
    AnnualRenewalNotice:
      type: object
      additionalProperties: false
      required:
        [noticeId, subscriptionVersion, paidThroughAt, scheduledAt, state, obsoleteReason]
      properties:
        noticeId: { type: string, format: uuid }
        subscriptionVersion: { type: integer, minimum: 1 }
        paidThroughAt: { type: string, format: date-time }
        scheduledAt: { type: string, format: date-time }
        state: { type: string, enum: [SCHEDULED, READY, OBSOLETE] }
        obsoleteReason:
          { type: [string, "null"], enum: [PERIOD_CHANGED, SUBSCRIPTION_INELIGIBLE, null] }
    Plan:
      type: object
      required:
        [code, billingFrequency, recurring, annualEquivalentMonthlyPayments]
      properties:
        code: { type: string, enum: [MONTHLY, ANNUAL] }
        billingFrequency: { type: string, enum: [MONTHLY, ANNUAL] }
        recurring: { type: boolean }
        annualEquivalentMonthlyPayments:
          anyOf:
            - { type: integer, const: 10 }
            - { type: "null" }
    CheckoutOffer:
      type: object
      required:
        [planCode, amountMinorUnits, currency, termsVersion, offerVersion]
      properties:
        planCode: { type: string, enum: [MONTHLY, ANNUAL] }
        amountMinorUnits: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        termsVersion: { type: string }
        offerVersion: { type: string }
    CheckoutOperation:
      type: object
      required:
        [
          operationId,
          planCode,
          state,
          amountMinorUnits,
          currency,
          termsVersion,
          createdAt,
          redirectUrl,
          replayed,
        ]
      properties:
        operationId: { type: string, format: uuid }
        planCode: { type: string, enum: [MONTHLY, ANNUAL] }
        state:
          {
            type: string,
            enum:
              [
                REQUESTED,
                SUBMITTING,
                CHECKOUT_READY,
                OUTCOME_UNKNOWN,
                CONFIRMED,
                DECLINED,
              ],
          }
        amountMinorUnits: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        termsVersion: { type: string }
        createdAt: { type: string, format: date-time }
        redirectUrl: { type: [string, "null"], format: uri }
        replayed: { type: boolean }
    CheckoutAttempt:
      type: object
      required:
        [operationId, planCode, state, createdAt, expectedSubscriptionVersion]
      properties:
        operationId: { type: string, format: uuid }
        planCode: { type: string, enum: [MONTHLY, ANNUAL] }
        state:
          {
            type: string,
            enum:
              [
                REQUESTED,
                SUBMITTING,
                CHECKOUT_READY,
                OUTCOME_UNKNOWN,
                CONFIRMED,
                DECLINED,
              ],
          }
        createdAt: { type: string, format: date-time }
        expectedSubscriptionVersion: { type: integer, minimum: 0 }
