spring:
  application:
    name: agendamento-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
    username: ${DB_USERNAME:agendamento}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: agendamento
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/agendamento}}
    user: ${FLYWAY_DB_USERNAME:${POSTGRES_USER:agendamento}}
    password: ${FLYWAY_DB_PASSWORD:${POSTGRES_PASSWORD:${DB_PASSWORD}}}
    schemas: agendamento
    default-schema: agendamento
    create-schemas: true
    clean-disabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: agendamento.spring_session
      cleanup-cron: "0 0 * * * *"
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: AGDSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

app:
  outbox:
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:false}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
      lease-seconds: ${OUTBOX_WORKER_LEASE_SECONDS:60}
      max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:8}
      poll-delay-ms: ${OUTBOX_WORKER_POLL_DELAY_MS:1000}
