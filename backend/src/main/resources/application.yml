spring:
  application:
    name: agendamento-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
    username: ${DB_USERNAME:agendamento}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: agendamento
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/agendamento}}
    user: ${FLYWAY_DB_USERNAME:${POSTGRES_USER:agendamento}}
    password: ${FLYWAY_DB_PASSWORD:${POSTGRES_PASSWORD:${DB_PASSWORD}}}
    schemas: agendamento
    default-schema: agendamento
    create-schemas: true
    clean-disabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: agendamento.spring_session
      cleanup-cron: "0 0 * * * *"
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: AGDSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

app:
  public-booking:
    digest:
      active-key-id: ${PUBLIC_BOOKING_HMAC_ACTIVE_KEY_ID:}
      keys: ${PUBLIC_BOOKING_HMAC_KEYS:}
  client-access:
    keys:
      verifier-active-id: ${CLIENT_ACCESS_VERIFIER_ACTIVE_KEY_ID:}
      phone-encryption-active-id: ${CLIENT_ACCESS_PHONE_ENCRYPTION_ACTIVE_KEY_ID:}
      fingerprint-id: ${CLIENT_ACCESS_FINGERPRINT_KEY_ID:}
      verifier-ring: ${CLIENT_ACCESS_VERIFIER_KEY_RING:}
      fingerprint: ${CLIENT_ACCESS_FINGERPRINT_KEY:}
      phone-encryption-ring: ${CLIENT_ACCESS_PHONE_ENCRYPTION_KEY_RING:}
    session:
      ttl-seconds: ${CLIENT_ACCESS_SESSION_TTL_SECONDS:0}
      cookie-secure: ${CLIENT_ACCESS_COOKIE_SECURE:true}
    e2e-emitter-enabled: ${CLIENT_ACCESS_E2E_EMITTER_ENABLED:false}
    e2e-emitter-secret: ${CLIENT_ACCESS_E2E_EMITTER_SECRET:}
  outbox:
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:false}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
      lease-seconds: ${OUTBOX_WORKER_LEASE_SECONDS:60}
      max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:8}
      poll-delay-ms: ${OUTBOX_WORKER_POLL_DELAY_MS:1000}
  subscriptions:
    trial-expiry-worker:
      enabled: ${SUBSCRIPTION_TRIAL_EXPIRY_WORKER_ENABLED:true}
      poll-delay-ms: ${SUBSCRIPTION_TRIAL_EXPIRY_POLL_DELAY_MS:60000}
