name: kronos-agd052-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:${AGD052_PROMETHEUS_PORT:-19090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - agd052_observability_scrape_token
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ${AGD052_PROMETHEUS_TARGET_DIR:-./ops/observability/prometheus/targets}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${AGD052_GRAFANA_ADMIN_USER:?Configure AGD052_GRAFANA_ADMIN_USER outside Git}
      GF_SECURITY_ADMIN_PASSWORD: ${AGD052_GRAFANA_ADMIN_PASSWORD:?Configure AGD052_GRAFANA_ADMIN_PASSWORD outside Git}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:${AGD052_GRAFANA_PORT:-13000}/
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:${AGD052_GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    restart: unless-stopped

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

secrets:
  agd052_observability_scrape_token:
    file: ${AGD052_SCRAPE_TOKEN_FILE:?Configure a synthetic/local scrape-token file outside Git}
