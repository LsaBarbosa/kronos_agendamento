groups:
  - name: agd052-source-health
    interval: 15s
    rules:
      - record: agd052_metrics_source_collector_enabled
        expr: |
          (
            label_replace(agd_worker_configuration{worker="outbox",state="enabled"} == 1, "source", "outbox", "worker", ".*")
            or label_replace(agd_worker_configuration{worker="notifications",state="enabled"} == 1, "source", "notifications", "worker", ".*")
            or label_replace(agd_worker_configuration{worker="subscription_dunning",state="enabled"} == 1, "source", "subscriptions", "worker", ".*")
            or label_replace(agd_worker_configuration{worker="exports",state="enabled"} == 1, "source", "exports", "worker", ".*")
          )
          and on (instance) (up{job="kronos-application"} == 1)

      - alert: KronosApplicationScrapeUnavailable
        expr: up{job="kronos-application"} == 0
        for: 2m
        labels:
          severity: critical
          responsible_role: platform-operations
          runbook: application-scrape
        annotations:
          summary: Endpoint Prometheus da aplicação indisponível
          description: >-
            O target configurado de /actuator/prometheus falha há dois minutos.
            Sem target cadastrado não existe série e nenhuma saúde é inferida.
          runbook_path: docs/runbooks/AGD-052/application-scrape.md

      - alert: MetricsSourceSampleMetricMissing
        expr: agd052_metrics_source_collector_enabled unless on (instance, source) agd_metrics_source_sampled
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Série sampled da fonte esperada está ausente
          description: >-
            O worker da fonte está habilitado e a aplicação responde, mas o contrato
            não expõe a série sampled para esta fonte implementada.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceNeverSampled
        expr: (agd_metrics_source_sampled == 0) and on (instance, source) agd052_metrics_source_collector_enabled
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Fonte habilitada ainda não foi amostrada
          description: >-
            sampled=0 indica ausência de primeira coleta; não significa sucesso,
            indisponibilidade observada nem contagem zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceUnavailable
        expr: |
          (agd_metrics_source_sampled == 1)
          and on (instance, source) (agd_metrics_source_available == 0)
          and on (instance, source) agd052_metrics_source_collector_enabled
        for: 1m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Falha observada ao coletar projeção de fonte habilitada
          description: >-
            sampled=1 e available=0 indicam falha observada; preserve o último
            sucesso e não substitua gauges de negócio por zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessMissing
        expr: |
          ((agd_metrics_source_sampled == 1)
            and on (instance, source) agd052_metrics_source_collector_enabled)
          unless on (instance, source) agd_metrics_source_last_success_timestamp
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Fonte amostrada ainda não concluiu coleta bem-sucedida
          description: >-
            Existe tentativa observada, mas nenhum timestamp de coleta completa
            bem-sucedida. Consulte o resultado de coleta sem inferir valor zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessStale
        expr: |
          (time() - agd_metrics_source_last_success_timestamp > 120)
          and on (instance, source) agd052_metrics_source_collector_enabled
        for: 1m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Último sucesso de coleta está obsoleto
          description: >-
            O último sucesso tem mais de dois minutos para uma fonte esperada e
            habilitada; a projeção não é um snapshot atômico entre fontes.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

  - name: agd052-api-and-workers
    interval: 15s
    rules:
      - alert: ApiServerErrorRatioHigh
        expr: |
          (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05)
          and (sum(rate(http_server_requests_seconds_count[5m])) > 0)
        for: 5m
        labels:
          severity: warning
          responsible_role: application-operations
          runbook: api-errors
        annotations:
          summary: Proporção de respostas HTTP 5xx acima de 5%
          description: >-
            O limiar local de demonstração é 5% por cinco minutos com tráfego
            observado; não é SLO nem SLA.
          runbook_path: docs/runbooks/AGD-052/api-errors.md

      - alert: WorkerEnabledWithoutProgress
        expr: |
          (
            (
              (time() - agd_worker_progress_timestamp_seconds > 300)
              or
              (
              agd_worker_configuration{state="enabled"} == 1
              unless on (worker, instance) agd_worker_progress_timestamp_seconds
              )
            )
            and on (worker, instance)
              (agd_worker_configuration{state="enabled"} == 1)
          )
          and on (worker)
            (max by (worker) (agd_workers_backlog_eligible) > 0)
        for: 2m
        labels:
          severity: warning
          responsible_role: application-operations
          runbook: worker-progress
        annotations:
          summary: Worker habilitado sem progresso com itens elegíveis
          description: >-
            O limiar local é cinco minutos sem progresso mais dois minutos de
            persistência do alerta. Exige estado enabled e backlog maior que zero.
          runbook_path: docs/runbooks/AGD-052/worker-progress.md

      - alert: WorkerEligibleBacklogOld
        expr: |
          (max by (worker) (agd_workers_backlog_oldest_age_seconds) > 600)
          and on (worker) (max by (worker) (agd_workers_backlog_eligible) > 0)
          and on (worker)
            (max by (worker) (agd_worker_configuration{state="enabled"} == 1) == 1)
        for: 5m
        labels:
          severity: warning
          responsible_role: application-operations
          runbook: worker-backlog
        annotations:
          summary: Item elegível de worker com idade superior a dez minutos
          description: >-
            O limiar local é idade acima de dez minutos por cinco minutos. Backlog
            e idade globais duplicados entre instâncias usam max por worker, nunca sum.
          runbook_path: docs/runbooks/AGD-052/worker-backlog.md

      - alert: WorkerRepeatedExecutionFailures
        expr: |
          (sum by (worker) (increase(agd_worker_executions_total{result="failed",worker=~"outbox|reminders|subscription_dunning"}[10m])) >= 3)
          and on (worker) (max by (worker) (agd_workers_backlog_eligible) > 0)
          and on (worker)
            (max by (worker) (agd_worker_configuration{state="enabled"} == 1) == 1)
        for: 2m
        labels:
          severity: warning
          responsible_role: application-operations
          runbook: worker-backlog
        annotations:
          summary: Worker acumula três ciclos com falha em dez minutos
          description: >-
            Contador por processo usa increase para tolerar reset/restart; o alerta
            exige worker habilitado e trabalho elegível no snapshot atual.
          runbook_path: docs/runbooks/AGD-052/worker-backlog.md

  - name: agd052-reconciliation
    interval: 15s
    rules:
      - alert: FinancialOutcomeUnknownPending
        expr: max by (subsystem) (agd_reconciliation_outcome_unknown{subsystem="payments"}) > 0
        for: 1m
        labels:
          severity: critical
          responsible_role: financial-operations
          runbook: financial-reconciliation
        annotations:
          summary: Resultado financeiro ambíguo aguarda reconciliação
          description: >-
            O gauge global persistido é reduzido com max, não soma. Não autoriza
            cobrança nova, retry cego nem inferência de pagamento.
          runbook_path: docs/runbooks/AGD-052/financial-reconciliation.md

      - alert: NotificationOutcomeUnknownPending
        expr: max by (subsystem) (agd_reconciliation_outcome_unknown{subsystem="notifications"}) > 0
        for: 1m
        labels:
          severity: warning
          responsible_role: notification-operations
          runbook: notification-reconciliation
        annotations:
          summary: Resultado de notificação ambíguo aguarda reconciliação
          description: >-
            Contagem de estado persistido quando suportada. Aceite do transporte
            não significa entrega; não repetir mensagem às cegas.
          runbook_path: docs/runbooks/AGD-052/notification-reconciliation.md

      - alert: NotificationWorkerRepeatedFailures
        expr: |
          (sum by (worker) (increase(agd_worker_executions_total{worker="notifications",result="failed"}[10m])) >= 3)
          and on (worker) (max by (worker) (agd_workers_backlog_eligible) > 0)
          and on (worker)
            (max by (worker) (agd_worker_configuration{state="enabled"} == 1) == 1)
        for: 2m
        labels:
          severity: warning
          responsible_role: notification-operations
          runbook: notification-reconciliation
        annotations:
          summary: Worker de notificações falha repetidamente com itens elegíveis
          description: >-
            Alerta sobre ciclos do worker, não sobre entrega de mensagens. Exige
            trabalho elegível e estado enabled; fornecedor continua independente.
          runbook_path: docs/runbooks/AGD-052/notification-reconciliation.md

      - alert: ExportWorkerRepeatedFailures
        expr: |
          (sum by (worker) (increase(agd_worker_executions_total{worker="exports",result="failed"}[10m])) >= 3)
          and on (worker) (max by (worker) (agd_workers_backlog_eligible) > 0)
          and on (worker)
            (max by (worker) (agd_worker_configuration{state="enabled"} == 1) == 1)
        for: 2m
        labels:
          severity: warning
          responsible_role: export-operations
          runbook: export-reconciliation
        annotations:
          summary: Worker de exportação falha repetidamente com itens elegíveis
          description: >-
            Alerta sobre ciclos do worker, não sobre falha final de cada job. Exige
            trabalho elegível e estado enabled.
          runbook_path: docs/runbooks/AGD-052/export-reconciliation.md
