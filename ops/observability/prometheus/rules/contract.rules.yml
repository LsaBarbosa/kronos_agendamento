          runbook: metrics-source
        annotations:
          summary: Fonte notifications nunca concluiu coleta
          description: Ausência de timestamp de sucesso não é contagem zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessMissingSubscriptions
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "subscriptions", "job", ".*")
