groups:
  - name: agd052-application
    interval: 15s
    rules:
      - alert: KronosApplicationScrapeUnavailable
        expr: up{job="kronos-application"} == 0
        for: 2m
        labels:
          severity: critical
          responsible_role: platform-operations
          runbook: application-scrape
        annotations:
          summary: Endpoint Prometheus da aplicação indisponível
          description: >-
            O target configurado de /actuator/prometheus falha há dois minutos.
            Sem target cadastrado não existe série e nenhuma saúde é inferida.
          runbook_path: docs/runbooks/AGD-052/application-scrape.md

      - alert: MetricsSourceUnavailable
        expr: agd_metrics_source_available == 0 and on (instance) (up{job="kronos-application"} == 1)
        for: 1m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Coleta de uma fonte de métricas falha
          description: >-
            A fonte {{ $labels.source }} reporta falha observada; gauges de negócio
            mantêm o último sucesso e não são substituídos por zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessStale
        expr: |
          (time() - agd_metrics_source_last_success_timestamp_seconds > 120)
          and on (instance) (up{job="kronos-application"} == 1)
        for: 1m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Último sucesso de coleta está obsoleto
          description: "A fonte {{ $labels.source }} está sem coleta completa bem-sucedida há mais de dois minutos."
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceStateMissingPostgresql
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "postgresql", "job", ".*")
          unless on (instance, source) agd_metrics_source_available{source="postgresql"}
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Estado da fonte PostgreSQL ausente
          description: >-
            A instância é scrapeada, mas não expõe estado da fonte. Ausência não é
            zero nem coleta saudável.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessMissingPostgresql
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "postgresql", "job", ".*")
          unless on (instance, source) agd_metrics_source_last_success_timestamp_seconds{source="postgresql"}
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Fonte PostgreSQL nunca concluiu coleta
          description: Ausência de timestamp de sucesso não é contagem zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessMissingAppointments
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "appointments", "job", ".*")
          unless on (instance, source) agd_metrics_source_last_success_timestamp_seconds{source="appointments"}
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Fonte appointments nunca concluiu coleta
          description: Ausência de timestamp de sucesso não é contagem zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessMissingOutbox
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "outbox", "job", ".*")
          unless on (instance, source) agd_metrics_source_last_success_timestamp_seconds{source="outbox"}
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Fonte outbox nunca concluiu coleta
          description: Ausência de timestamp de sucesso não é contagem zero.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceLastSuccessMissingNotifications
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "notifications", "job", ".*")
