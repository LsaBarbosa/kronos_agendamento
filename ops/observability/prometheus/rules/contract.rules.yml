        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "exports", "job", ".*")
          unless on (instance, source) agd_metrics_source_available{source="exports"}
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Estado da fonte exports ausente
          description: >-
            A instância é scrapeada, mas não expõe estado da fonte. Ausência não é
