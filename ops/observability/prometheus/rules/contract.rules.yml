      - alert: MetricsSourceStateMissingAppointments
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "appointments", "job", ".*")
          unless on (instance, source) agd_metrics_source_available{source="appointments"}
        for: 3m
        labels:
          severity: warning
