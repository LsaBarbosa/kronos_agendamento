        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "outbox", "job", ".*")
          unless on (instance, source) agd_metrics_source_available{source="outbox"}
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Estado da fonte outbox ausente
          description: >-
            A instância é scrapeada, mas não expõe estado da fonte. Ausência não é
            zero nem coleta saudável.
          runbook_path: docs/runbooks/AGD-052/metrics-source.md

      - alert: MetricsSourceStateMissingNotifications
        expr: |
          label_replace(up{job="kronos-application"} == 1, "source", "notifications", "job", ".*")
          unless on (instance, source) agd_metrics_source_available{source="notifications"}
        for: 3m
        labels:
          severity: warning
          responsible_role: platform-operations
          runbook: metrics-source
        annotations:
          summary: Estado da fonte notifications ausente
          description: >-
