name: App CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check frontend formatting and lint
        run: |
          npm run format:check
          npm run lint
      - name: Run frontend tests and production build
        run: |
          npm test
          npm run check
      - name: Audit locked frontend dependencies
        run: npm audit --audit-level=high

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile and test with PostgreSQL Testcontainers
        run: |
          ./mvnw -B -ntp spotless:check
          ./mvnw -B -ntp verify
      - name: Build local image and capture its identity
        run: |
          docker build --iidfile ../backend-image-id.txt -t agendamento-backend:ci .
          cat ../backend-image-id.txt
      - name: Scan backend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agendamento-backend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.75.0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend-image-id.txt

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan backend container configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/Dockerfile
          scanners: misconfig
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.75.0
      - name: Scan pinned Keycloak image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: quay.io/keycloak/keycloak@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
          scanners: vuln
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.75.0

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        path: [backend/src, frontend/src, .github, docs, infra, scripts, compose.yaml, compose.keycloak.yaml, compose.identity.yaml]
    steps:
      - uses: actions/checkout@v4
      - name: Scan source tree for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          scanners: secret
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.75.0

  oidc-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare disposable local credentials
        run: |
          bash scripts/dev/prepare-local-env.sh
          bash scripts/dev/prepare-keycloak.sh
      - name: Start PostgreSQL, Keycloak and backend
        run: |
          if [[ -v APP_BILLING_E2E_WEBHOOK_SECRET ]]; then
            echo "E2E payment secret host override detected; Compose will use the disposable env file."
          fi
          unset APP_BILLING_E2E_WEBHOOK_SECRET
          docker compose -p agendamento --env-file .env --env-file .env.keycloak --env-file .env.e2e \
            -f compose.yaml -f compose.keycloak.yaml -f compose.identity.yaml -f compose.e2e.yaml \
            --profile app up --build --wait --wait-timeout 240 -d
      - name: Provision linked and unlinked OIDC users
        env:
          AGD_E2E_TRIAL_FIXTURE: 'true'
        run: bash scripts/dev/provision-demo-admin.sh demo-clinica "Clínica Demonstração"
      - name: Install frontend and start Vite proxy
        working-directory: frontend
        run: |
          npm ci
          npm run dev -- --host 127.0.0.1 > /tmp/agendamento-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/admin >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/agendamento-vite.log
          exit 1
      - name: Exercise OIDC in headless Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -a
          source .env.e2e
          set +a
          node scripts/dev/test-keycloak-browser.mjs
      - name: Report safe E2E payment webhook rejection categories
        if: failure()
        run: |
          docker compose -p agendamento --env-file .env --env-file .env.keycloak --env-file .env.e2e \
            -f compose.yaml -f compose.keycloak.yaml -f compose.identity.yaml -f compose.e2e.yaml \
            --profile app logs --no-color backend 2>&1 | grep 'payment_webhook_e2e' || true
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-browser-e2e-logs
          path: /tmp/agendamento-vite.log
          if-no-files-found: ignore
